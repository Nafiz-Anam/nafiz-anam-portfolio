services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-portfolio}
      UPLOAD_DIR: /repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/repo/apps/api/uploads

  web:
    build:
      context: ..
      dockerfile: docker/web-dev.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      INTERNAL_API_URL: http://api:4000
      NODE_ENV: development
    depends_on:
      - api
    ports:
      - "3002:3000"
    volumes:
      # Hot-reload: mount source + packages, keep container node_modules
      - ../apps/web:/repo/apps/web
      - ../packages:/repo/packages
    working_dir: /repo/apps/web

  cms:
    build:
      context: ..
      dockerfile: docker/cms-dev.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Server-side auth proxy routes reach API on the Docker network
      INTERNAL_API_URL: http://api:4000
      NODE_ENV: development
    depends_on:
      - api
    ports:
      - "3003:3001"
    volumes:
      - ../apps/cms:/repo/apps/cms
      - ../packages:/repo/packages
    working_dir: /repo/apps/cms

volumes:
  pgdata:
  api_uploads:
